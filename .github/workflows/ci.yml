name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Lint — minimal install: only ruff, mypy, and type stubs.
  # No torch, mediapipe, PySide6, or other heavy runtime deps are installed.
  # mypy is configured to ignore_missing_imports for those packages so that
  # style and type-checking still works correctly.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # lfs: false (default) — model weights are in LFS but are not needed for lint.

      - name: Pull notebook LFS objects
        # ruff checks *.ipynb files; all notebooks are LFS-tracked (see .gitattributes).
        # A selective pull fetches only the notebooks ruff needs, skipping large
        # model-weight blobs (IPN/weights/*.pth).
        run: git lfs pull --include="*.ipynb"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt system dependencies & Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libopengl0 xvfb

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install lightweight type-checked packages first, then the source
          # package without any of its heavy runtime deps.
          pip install pydantic PyYAML numpy huggingface_hub \
                      ruff mypy types-PyYAML types-PyAutoGUI
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/

      - name: Runtime tests (no training extras)
        run: xvfb-run -a pytest -m "not training"

  training:
    name: Training environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          # Remove large pre-installed tool-chains that are not needed here.
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt system dependencies & Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libopengl0 xvfb

      - name: Install runtime + dev + training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install runtime + dev + headless-OpenCV dependencies
        run: pip install -e ".[dev,headless]"

      - name: Runtime tests (no training extras)
        run: pytest -m "not training"

  # ---------------------------------------------------------------------------
  # Training — full suite including scikit-learn tests.
  # Same CPU-torch optimisation as the test job.
  # ---------------------------------------------------------------------------
  training:
    name: Training tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install runtime + dev + headless-OpenCV + training dependencies
        run: pip install -e ".[dev,headless,training]"

      - name: Full test suite (including training tests)
        run: xvfb-run -a pytest
