name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Lint — minimal install: only ruff, mypy, and type stubs.
  # No torch, mediapipe, PySide6, or other heavy runtime deps are installed.
  # mypy is configured to ignore_missing_imports for those packages so that
  # style and type-checking still works correctly.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          # Install lightweight type-checked packages first, then the source
          # package without any of its heavy runtime deps.
          pip install pydantic PyYAML numpy huggingface_hub \
                      ruff mypy types-PyYAML types-PyAutoGUI
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/

      - name: Runtime tests (no training extras)
        run: pytest -m "not training"

  training:
    name: Training environment
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libopengl0

      - name: Install runtime + dev + training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,training]"

      - name: Full test suite (including training tests)
        run: pytest
