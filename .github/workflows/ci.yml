name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  runtime:
    name: Runtime environment
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt system dependencies & Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libopengl0 xvfb

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/

      - name: Runtime tests (no training extras)
        run: xvfb-run -a pytest -m "not training"

  training:
    name: Training environment
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt system dependencies & Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libopengl0 xvfb

      - name: Install runtime + dev + training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,training]"

      - name: Full test suite (including training tests)
        run: xvfb-run -a pytest
