name: Build application bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload build artifacts"
        type: boolean
        default: true

jobs:
  # ── Test gate: all tests must pass before any build ─────────────────────
  test:
    name: Test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libglib2.0-0 \
            xvfb

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Verify Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1' || true
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so.1
          test -e /usr/lib/x86_64-linux-gnu/libGL.so.1

      - name: Run tests (non-training)
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pytest -m "not training" -q
          else
            pytest -m "not training" -q
          fi
        shell: bash

  # ── macOS .app bundle ────────────────────────────────────────────────────
  build-macos:
    name: Build macOS .app
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          pip uninstall -y opencv-python-headless || true
          pip install -e ".[ui,build]"

      - name: Download offline model
        run: python scripts/download_bundled_model.py

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm maestro.spec

      - name: Ad-hoc code sign for Apple Silicon
        run: codesign --force --deep --sign - dist/Maestro.app

      - name: Verify bundle
        run: test -d dist/Maestro.app

      - name: Install create-dmg
        run: npm install -g create-dmg

      - name: Create DMG archive
        run: |
          create-dmg \
            --overwrite \
            --no-code-sign \
            dist/Maestro.app dist/ || true
          mv dist/Maestro*.dmg dist/Maestro-macos.dmg

      - name: Upload macOS artifact
        if: ${{ github.event_name == 'push' || inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-macos
          path: dist/Maestro-macos.dmg
          retention-days: 30

  # ── Windows .exe installer ───────────────────────────────────────────────
  build-windows:
    name: Build Windows .exe
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          pip uninstall -y opencv-python-headless 2>NUL || echo "Not installed."
          pip install -e ".[ui,build]"

      - name: Download offline model
        run: python scripts/download_bundled_model.py

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm maestro.spec

      - name: Verify executable
        run: Test-Path dist\Maestro\Maestro.exe
        shell: pwsh

      - name: Create Windows Installer
        run: iscc installer.iss

      - name: Upload Windows artifact
        if: ${{ github.event_name == 'push' || inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-windows
          path: dist/Maestro_Setup.exe
          retention-days: 30

  # ── GitHub Release (on tag push only) ───────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Maestro-macos
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Maestro-windows
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/Maestro-macos.dmg
            dist/Maestro_Setup.exe
