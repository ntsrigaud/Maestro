model:
  model_name: two_stream_attn_finetune_hybrid_10class
  input_size: 147
  hidden_size: 96
  num_layers: 2
  dropout: 0.4
  num_classes: 10
  num_heads: 8
  proj_dim: 96
  motion_temporal_conv: false
  motion_attn_pool: false
  baseline_backbone: resnet18
  sample_size: 32
  width_mult: 1.0
  shortcut_type: B
  cardinality: 32
training:
  epochs: 80
  batch_size: 128
  learning_rate: 3.0e-05
  weight_decay: 0.001
  grad_clip_norm: 1.0
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0001
  seed: 42
  num_workers: 0
  class_weighting: true
  label_smoothing: 0.05
  max_samples_per_class: 3000
  exclude_classes: null
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true
scheduler:
  enabled: true
  factor: 0.5
  patience: 10
  min_lr: 1.0e-06
export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  feature_schema_version: feature-schema-v5
