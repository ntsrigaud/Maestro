model:
  model_name: two_stream_attn_v1
  input_size: 147
  hidden_size: 64
  num_layers: 2
  dropout: 0.3
  num_classes: 2
  num_nodes: 67
  num_coords: 3
  stgcn_channels:
  - 64
  - 128
  num_stgcn_layers: 2
  lstm_hidden: 128
  lstm_layers: 2
  phono_proj_dim: 128
  phono_conv_channels: 256
  num_heads: 4
  proj_dim: 64
training:
  epochs: 150
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.001
  grad_clip_norm: 1.0
  early_stopping_patience: 25
  early_stopping_min_delta: 0.0001
  seed: 42
  num_workers: 2
  class_weighting: true
  label_smoothing: 0.0
  max_samples_per_class: null
  exclude_classes: null
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true
scheduler:
  enabled: true
  factor: 0.1
  patience: 10
  min_lr: 1.0e-06
export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  feature_schema_version: feature-schema-v5
  graph_schema_version: graph-schema-v1
