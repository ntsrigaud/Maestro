acceptance:
  default: 0.85
  critical: 0.90

# Dynamic swipe gestures tolerate a slightly lower threshold because
# their short temporal span makes high-confidence peaks harder to sustain.
# Post-diagnostic production values. 0.70 confirmed stable.
class_thresholds:
  open_palm_hold: 0.75
  swipe_right: 0.70
  swipe_left: 0.70
  swipe_up: 0.70
  swipe_down: 0.70
  zoom_in: 0.70
  zoom_out: 0.70
  unknown: 1.00

# Stability vote windows (consecutive stabilised decisions required).
# Dynamic gestures use a window of 1 so they are dispatched immediately.
# Held gestures use 3 for false-trigger protection.
class_vote_windows:
  open_palm_hold: 3
  swipe_right: 1
  swipe_left: 1
  swipe_up: 1
  swipe_down: 1
  zoom_in: 2
  zoom_out: 2
  unknown: 1
