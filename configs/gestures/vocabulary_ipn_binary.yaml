version: ipn_binary_v1

# Binary vocabulary for the IPN-hand detector (Phase 3).
#
# Mirrors ipnbinary.json from the IPN-hand repository (deps/IPN-hand/):
#   - All non-gesture frames (D0X) → no_gesture (class 0)
#   - All gesture frames (B0A, B0B, G01..G11) → gesture (class 1)
#
# The detector runs on 8-frame rolling windows to decide WHEN a gesture
# is occurring in a continuous video stream (online_test.py).  The
# 13-class classifier (vocabulary_ipn_benchmark.yaml) is only invoked
# when the detector's moving-average score exceeds a threshold.
#
# IPN source mapping:
#   no_gesture  ← D0X (Non-gesture background)
#   gesture     ← B0A, B0B, G01, G02, G03, G04, G05, G06, G07, G08, G09, G10, G11

gestures:
  - no_gesture
  - gesture
