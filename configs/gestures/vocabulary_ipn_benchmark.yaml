version: ipn_v3

# Vocabulary derived from the IPN Hand dataset gesture classes.
# Full 14-class baseline set is included:
#   - D0X non-gesture background
#   - B0A/B0B pointing poses
#   - G01..G11 gesture labels
#
# IPN source mapping (all gesture classes):
#   unknown          ← D0X (Non-gesture background)
#   point_one        ← B0A (Pointing with one finger)
#   point_two        ← B0B (Pointing with two fingers)
#   open_palm_hold   ← G07 (Open twice)
#   swipe_right      ← G06 (Throw right)
#   swipe_left       ← G05 (Throw left)
#   swipe_up         ← G03 (Throw up)
#   swipe_down       ← G04 (Throw down)
#   zoom_in          ← G10 (Zoom in)
#   zoom_out         ← G11 (Zoom out)
#   click_one        ← G01 (Click with one finger)
#   click_two        ← G02 (Click with two fingers)
#   double_click_one ← G08 (Double click with one finger)
#   double_click_two ← G09 (Double click with two fingers)


# Used for comparisons

gestures:
  - point_one
  - point_two
  - open_palm_hold
  - swipe_right
  - swipe_left
  - swipe_up
  - swipe_down
  - zoom_in
  - zoom_out
  - click_one       
  - click_two       
  - double_click_one
  - double_click_two
