version: jester_27class_v1

# Full 27-class Jester vocabulary for IPN baseline comparison pretraining.
#
# All 27 original 20BN-Jester-v1 gesture classes are included.
# This vocabulary is used in Phase 1 of the IPN baseline comparison pipeline
# (Jester pretrain → IPN 13-class fine-tune).
#
# Source label mapping:
#   swiping_left                 ← Swiping Left
#   swiping_right                ← Swiping Right
#   swiping_down                 ← Swiping Down
#   swiping_up                   ← Swiping Up
#   pushing_hand_away            ← Pushing Hand Away
#   pulling_hand_in              ← Pulling Hand In
#   sliding_two_fingers_left     ← Sliding Two Fingers Left
#   sliding_two_fingers_right    ← Sliding Two Fingers Right
#   sliding_two_fingers_down     ← Sliding Two Fingers Down
#   sliding_two_fingers_up       ← Sliding Two Fingers Up
#   pushing_two_fingers_away     ← Pushing Two Fingers Away
#   pulling_two_fingers_in       ← Pulling Two Fingers In
#   rolling_hand_forward         ← Rolling Hand Forward
#   rolling_hand_backward        ← Rolling Hand Backward
#   turning_hand_clockwise       ← Turning Hand Clockwise
#   turning_hand_counterclockwise← Turning Hand Counterclockwise
#   zooming_in_full_hand         ← Zooming In With Full Hand
#   zooming_out_full_hand        ← Zooming Out With Full Hand
#   zooming_in_two_fingers       ← Zooming In With Two Fingers
#   zooming_out_two_fingers      ← Zooming Out With Two Fingers
#   thumb_up                     ← Thumb Up
#   thumb_down                   ← Thumb Down
#   shaking_hand                 ← Shaking Hand
#   stop_sign                    ← Stop Sign
#   drumming_fingers             ← Drumming Fingers
#   no_gesture                   ← No gesture
#   doing_other_things           ← Doing other things

