version: v3
# Presentation controller gesture-to-command mapping.
# Commands route to PresentationAdapter → KeyboardAdapter → pyautogui.
#
# Discrete gestures are routed through GestureActivationController and
# CommandDispatcher (one-shot, edge-triggered).
# Continuous gestures (point_one, point_two) bypass GestureActivationController
# entirely and are handled exclusively by LaserPointerTracker.

gesture_commands:
  swipe_up: start_presentation
  swipe_down: stop_presentation
  swipe_right: next_slide
  swipe_left: previous_slide
  zoom_in: zoom_in_view
  zoom_out: zoom_out_view
  open_palm_hold: zoom_out_totally
  unknown: no_action

gesture_modes:
  swipe_up: discrete
  swipe_down: discrete
  swipe_right: discrete
  swipe_left: discrete
  zoom_in: discrete
  zoom_out: discrete
  open_palm_hold: discrete
  point_one: continuous
  point_two: continuous
