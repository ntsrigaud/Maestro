version: v3
# Presentation controller gesture-to-command mapping.
# Commands route to PresentationAdapter → KeyboardAdapter → pyautogui.
#  swipe_up -> Start Presentation
#  swipe_down -> Stop Presentation
# swipe_left -> Previous Slide
# swipe_right -> Next Slide
# Point_one -> Mouse pointer
# Point_two -> Mouse pointer
# zoom_in -> Zoom In View
# zoom_out -> Zoom Out View
# open_palm_hold -> Zoom out totally
# unknown -> No Action (Noise Class)

gesture_commands:
  swipe_up: start_presentation
  swipe_down: stop_presentation
  swipe_right: next_slide
  swipe_left: previous_slide
  zoom_in: zoom_in_view
  zoom_out: zoom_out_view
  open_palm_hold: zoom_out_totally
  point_one: mouse_pointer
  point_two: mouse_pointer
  unknown: no_action
