version: v1
# Gesture-to-command mapping for the IPN-derived gesture vocabulary.
#
# Maps IPN vocabulary gesture labels to logical command IDs.  The
# activation_gesture (open_palm_hold / G07) is handled by
# GestureActivationController and is not listed here.
gesture_commands:
  swipe_right: next_slide
  swipe_left: previous_slide
  swipe_up: raise_hand
  swipe_down: start_presentation
  zoom_in: toggle_pointer_mode
  zoom_out: exit_presentation
