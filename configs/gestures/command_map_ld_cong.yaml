version: ld_cong_v1
# LD-CONG hybrid gesture-to-command mapping.
# Vocabulary: ld_cong_hybrid_v2 (14 classes — vocabulary_ld_cong_hybrid.yaml)
#
# Commands route to PresentationAdapter → KeyboardAdapter → pyautogui.
# Continuous gestures (point_one, point_two) bypass GestureActivationController
# entirely — point_one is handled by LaserPointerTracker, point_two by
# AnnotationPenTracker.

gesture_commands:
  # ── Navigation (LD-CONG directional, pooled with Jester swipes) ────────────
  swiping_up: start_presentation
  swiping_down: stop_presentation
  swiping_right: next_slide
  swiping_left: previous_slide

  # ── Zoom (Jester source) ───────────────────────────────────────────────────
  zooming_in_full_hand: zoom_in_view
  zooming_out_full_hand: zoom_out_view

  # ── LD-CONG unique gestures ────────────────────────────────────────────────
  palm:  erase_annotations     # open palm   → erase all slide annotations (E)
  pinch: activate_laser_pointer # precision pinch → enable laser-pointer mode (Ctrl+L)
  click: mouse_click            # finger click → left-click at cursor (links / animations)

  # ── IPN classes ────────────────────────────────────────────────────────────
  unknown: no_action

# Model output → display/dispatch label remapping.
# Applied after prediction stabilization, before command dispatch and UI display.
# The model was trained on raw camera frames where a natural right-swipe (palm
# facing the camera at end of stroke) appears as swiping_left from the camera's
# perspective.  Swapping here makes the gesture feel correct to the user without
# any retraining.
label_remap:
  swiping_left: swiping_right
  swiping_right: swiping_left

gesture_modes:
  # Discrete (one-shot, edge-triggered via GestureActivationController)
  swiping_up: discrete
  swiping_down: discrete
  swiping_right: discrete
  swiping_left: discrete
  zooming_in_full_hand: discrete
  zooming_out_full_hand: discrete
  palm: discrete
  fist: discrete
  thumb_up: discrete
  pinch: discrete
  click: discrete
  # Continuous (bypass dispatcher — handled by pointer trackers)
  point_one: continuous
  point_two: continuous
