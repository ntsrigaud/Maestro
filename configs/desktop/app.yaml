# Desktop Interaction — Application Configuration
# ================================================
# Load with: --config configs/desktop
#
# This directory overrides the default configs/ settings for close-range
# (desk distance) desktop interaction scenarios.  The model and feature
# pipeline remain identical; only app-level and inference-timing parameters
# differ.

app_name: gesture-control-desktop
camera_index: 0
frame_width: 640
frame_height: 480
target_fps: 30

# Mirror the preview window left-right (selfie-camera convention).
mirror_display: true

# Gesture-to-command vocabulary for desktop interaction.
command_map: command_map_desktop.yaml

# Horizontal swipe maps to virtual desktop navigation.
# Set to "tabs" to switch to Ctrl+Tab browser/editor tab navigation instead.
navigation_mode: workspace

# Desktop-specific tuning parameters.
desktop:
  # pyautogui scroll clicks per scroll gesture event.
  # Increase if scrolling feels sluggish; decrease for more precise control.
  scroll_clicks: 5
  # modifier+scroll steps per zoom event.
  zoom_clicks: 3
  # Linux desktop environment.  Used to select the correct Activities shortcut.
  # Supported: gnome (Super+A), kde (Super+W).  Others fall back to gnome.
  linux_de: gnome
