app_name: presentation-controller
camera_index: 0
frame_width: 1280
frame_height: 720
target_fps: 30
# Mirror the display window so the preview acts like a selfie camera.
# This does NOT affect MediaPipe landmark extraction or the ML pipeline;
# frames are always processed in the original (non-mirrored) coordinate space.
mirror_display: true
# Active gesture-to-command map (filename in configs/gestures/).
command_map: command_map_presentation.yaml
