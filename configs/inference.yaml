window_length: 24
window_step: 3
min_valid_ratio: 0.8
activation_hold_ms: 600
# 300 000 ms = 5 minutes.  The system remains ARMED for this long after the
# last recognised gesture, preventing repeated re-arming during presentations.
idle_timeout_ms: 300000
command_cooldown_ms: 1000
# edge_trigger_enabled: dispatch a command gesture only when the predicted
# label *changes* from the previous prediction (rising edge).  This is the
# primary guard against a single slow swipe firing multiple commands across
# consecutive overlapping inference windows.
edge_trigger_enabled: true
