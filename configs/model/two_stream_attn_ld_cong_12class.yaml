# ── EnhancedTwoStreamLSTM — LD-CONG Hybrid 10-class fine-tuning configuration ─
#
# Same as two_stream_attn_ld_cong.yaml (14-class) but with `palm`, `thumb_up`,
# `pinch`, and `click` excluded.  The exclude_classes filter is applied at dataset-load
# time so the ld_cong_hybrid_dataset.npz does NOT need to be rebuilt.
#
# Resulting vocabulary (10 classes):
#   fist,
#   swiping_right, swiping_left, swiping_down, swiping_up,
#   zooming_in_full_hand, zooming_out_full_hand,
#   point_one, point_two, unknown
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_name: two_stream_attn_v1
  input_size: 147       # feature-schema-v5 (must match pretrained backbone)
  hidden_size: 96       # must match pretrained checkpoint
  num_layers: 4         # must match pretrained checkpoint
  dropout: 0.35
  num_classes: 10       # 14 - 4 excluded (palm, thumb_up, pinch, click)
  num_heads: 8          # must match pretrained checkpoint
  proj_dim: 96          # must match pretrained checkpoint

training:
  epochs: 60
  batch_size: 128
  learning_rate: 0.00003   # 3e-5
  weight_decay: 0.0005
  grad_clip_norm: 1.0
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0001
  label_smoothing: 0.05
  seed: 42
  num_workers: 2
  class_weighting: false
  max_samples_per_class: 3000
  exclude_classes:
    - palm
    - thumb_up
    - pinch
    - click

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 8
  min_lr: 0.000001

export:
  onnx: false
  torchscript: false
