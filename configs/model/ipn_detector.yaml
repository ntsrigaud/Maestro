# ── EnhancedTwoStreamLSTM — IPN binary detector configuration ─────────────────
#
# Phase 3 of the IPN-hand paper pipeline: detector trained from scratch.
#
# Reproduces the IPN-hand paper detector training (run_det_ipn_trainRel-sc8b64.sh):
#   --dataset ipn --annotation_path ipnbinary.json
#   --n_classes 2 --n_finetune_classes 2
#   --sample_duration 8 --batch_size 64 --learning_rate 0.01
#   --model resnetl --model_depth 10 (trained from scratch, no pretrain_path)
#
# The detector is a binary model with two classes:
#   0 — no_gesture  (D0X non-gesture background)
#   1 — gesture     (any of B0A, B0B, G01..G11)
#
# Role in the continuous recognition pipeline (Phase 4b):
#   The detector runs on a short rolling window (8 frames) to decide WHEN a
#   gesture is occurring.  The classifier (Phase 2) is only invoked when the
#   detector's moving-average confidence crosses a threshold.  This two-model
#   architecture mirrors online_test.py where detector (sample_duration=8) and
#   classifier (sample_duration=32) share the same video stream.
#
# Weighted loss: paper uses weight=[1.0, 3.0] for [no_gesture, gesture] to
#   address class imbalance (D0X non-gesture dominates the annotation file).
#   Implemented here via class_weighting=true.
#
# No pretraining: unlike the classifier, the detector is trained from scratch
#   on IPN binary labels.  Do NOT pass a pretrained_checkpoint_path when
#   calling train_lstm() with this config.
#
# Dataset: build with build_ipn_dataset.py using --binary-labels flag:
#   python scripts/build_ipn_dataset.py \
#       --vocab-config configs/gestures/vocabulary_ipn_binary.yaml \
#       --binary-labels \
#       --window-length 8 --window-step 1 \
#       --output-npz data/processed/ipn_binary_dataset.npz
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_name: two_stream_attn_v1
  input_size: 147 # feature-schema-v5 (same feature extractor as classifier)
  hidden_size: 64 # lighter than classifier — detector needs speed, not depth
  num_layers: 2
  dropout: 0.3
  num_classes: 2 # binary: no_gesture=0, gesture=1
  num_heads: 4
  proj_dim: 64

training:
  epochs: 150 # matches paper: n_epochs=150 for detector
  batch_size: 64 # matches paper: batch_size=64
  learning_rate: 0.001 # AdamW equivalent of paper's SGD lr=0.01
  weight_decay: 0.001
  grad_clip_norm: 1.0
  early_stopping_patience: 25
  early_stopping_min_delta: 0.0001
  label_smoothing: 0.0 # no smoothing for binary detector
  seed: 42
  num_workers: 2
  class_weighting: true # weight=[1.0, 3.0] — gesture class is underrepresented
  max_samples_per_class: null

splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.1 # matches paper lr decay ×0.1 at step epochs
  patience: 10
  min_lr: 0.000001

export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  feature_schema_version: feature-schema-v5

# No augmentation for detector — it must remain sensitive to short-window cues.
