# ── EnhancedTwoStreamLSTM — IPN 13-class classifier fine-tuning configuration ─
#
# Phase 2 of the Jester → IPN transfer learning pipeline.
#
# Reproduces the IPN-hand paper classifier training (run_clf_ipn_trainRex-js32b32.sh):
#   --pretrain_path jester_resnext_101_RGB_32.pth --pretrain_dataset jester
#   --n_classes 13 --n_finetune_classes 13
#
# CLASS COUNT: 13 gesture classes (D0X/non-gesture excluded from classifier
# training, matching Table 2 of the IPN-hand paper and ipnall_but_None.json).
# The "non-gesture" class is handled exclusively by the separate binary
# detector (Phase 3 / ipn_detector.yaml), NOT by the classifier.
#
# Fine-tuning strategy (implemented in notebook 07):
#   Stage A — Head-only (frozen backbone, 10 epochs):
#     Only the new IPN classification head is trained.  The Jester-pretrained
#     backbone weights are frozen.  This seeds the head in the right direction
#     before joint optimisation.  Mirrors --ft_begin_index 0 in the paper.
#   Stage B — Full model (all layers unfrozen):
#     Both backbone and head are fine-tuned jointly with a small learning rate
#     (lr=3e-5, 1/3 of pretraining lr).  early_stopping_patience is set
#     conservatively to avoid catastrophic forgetting.
#
# Learning rate rationale:
#   Pretraining lr = 1e-4.  Fine-tuning backbone lr = 3e-5 (3×).
#   This is consistent with the "discriminative fine-tuning" approach where
#   lower layers are trained more conservatively than higher layers.
#
# Dataset: build with build_ipn_dataset.py (D0X/unknown excluded via vocabulary)
#   python scripts/build_ipn_dataset.py \
#       --vocab-config configs/gestures/vocabulary_ipn_benchmark.yaml \
#       --window-length 32 --window-step 1 \
#       --output-npz data/processed/ipn_finetune_dataset.npz
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_name: two_stream_attn_v1
  input_size: 147 # feature-schema-v5 (must match pretrained backbone)
  hidden_size: 96 # must match pretrained checkpoint (two_stream_attn_jester.yaml)
  num_layers: 2 # must match pretrained checkpoint
  dropout: 0.35
  num_classes: 13 # 13 gesture classes (D0X excluded — matches IPN paper Table 2)
  num_heads: 8 # must match pretrained checkpoint
  proj_dim: 96 # must match pretrained checkpoint

training:
  epochs: 60
  batch_size: 128
  # Stage B learning rate (full-model fine-tuning).
  # Stage A (head-only) uses lr=1e-3 and is run inline in the notebook.
  learning_rate: 0.00003 # 3e-5 — conservative for fine-tuning
  weight_decay: 0.0005
  grad_clip_norm: 1.0
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0001
  label_smoothing: 0.05
  seed: 42
  num_workers: 2
  class_weighting: false # handled by max_samples_per_class cap
  # Per-class cap — same reasoning as two_stream_attn_ipn32.yaml
  # IPN has extreme imbalance (point_one/two: ~145,000 samples vs swipe: ~2,400)
  # Cap at 8,000 to keep all 14 classes balanced.
  max_samples_per_class: 8000

splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 8
  min_lr: 0.000001

export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  feature_schema_version: feature-schema-v5

augmentation:
  enabled: true
  temporal_scale_range: [0.75, 1.25]
  spatial_jitter_sigma: 0.008
  apply_prob: 0.6
  mirror_flip_prob: 0.5
