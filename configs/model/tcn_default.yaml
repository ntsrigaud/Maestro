model:
  model_name: tcn_v1
  input_size: 144
  # List of channel widths for each TCN residual block.
  # Dilation doubles per level: 1, 2, 4, 8 → receptive field = 2*(2^4-1)*(kernel-1)+1.
  num_channels: [64, 64, 64, 64]
  kernel_size: 3
  dropout: 0.2
  num_classes: 8
  # Placeholder LSTM fields — not used by TCN; kept so the loader doesn't fail
  # when reading ModelConfig from a checkpoint.
  hidden_size: 128
  num_layers: 2

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0001
  seed: 42
  num_workers: 0
  class_weighting: true

splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 3
  min_lr: 0.000001

export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  registry_path: models/registry.json
  feature_schema_version: feature-schema-v4

augmentation:
  enabled: true
  temporal_scale_range: [0.8, 1.2]
  spatial_jitter_sigma: 0.005
  apply_prob: 0.5
  mirror_flip_prob: 0.5
