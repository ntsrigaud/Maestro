# ── EnhancedTwoStreamLSTM v2 — LD-CONG Hybrid 14-class, motion branch variants ─
#
# Exploration config for two targeted motion-branch improvements over the v1
# baseline (two_stream_attn_ld_cong.yaml):
#
#   1. motion_temporal_conv: true
#      Inserts a Conv1d(96, 96, kernel=3) + GELU + LayerNorm on the motion
#      branch *after* feature projection and *before* the BiLSTM.  Captures
#      short-range temporal structure in velocity / spread features.
#      Extra params: ~27 K (for proj_dim=96).
#
#   2. motion_attn_pool: true
#      Replaces mean+max temporal pooling on the motion branch with a learnable
#      single-head attention pool (Linear(192→1) → softmax over T → weighted
#      sum).  Lets the model learn which frames within the window matter most.
#      Extra params: ~385 (one Linear layer).
#
# Both flags default to False in the model class so the v1 baseline is
# unaffected.  Toggle individually to isolate each contribution, or set both
# to true for the combined variant:
#
#   Experiment matrix:
#     A  (baseline):  motion_temporal_conv: false  motion_attn_pool: false
#     B  (+tcn):      motion_temporal_conv: true   motion_attn_pool: false
#     C  (+attn):     motion_temporal_conv: false  motion_attn_pool: true
#     D  (both):      motion_temporal_conv: true   motion_attn_pool: true
#
# All other architecture / training hyperparameters are identical to v1 so
# results are directly comparable.  Fine-tune from the same Jester checkpoint.
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_name: two_stream_attn_v1
  input_size: 147       # feature-schema-v5 (must match pretrained backbone)
  hidden_size: 96       # must match pretrained checkpoint
  num_layers: 4         # must match pretrained checkpoint
  dropout: 0.35
  num_classes: 14       # 14 LD-CONG hybrid classes
  num_heads: 8          # must match pretrained checkpoint
  proj_dim: 96          # must match pretrained checkpoint
  # ── Motion branch variants (change these to run each experiment) ──────────
  motion_temporal_conv: true   # set false for experiment A or C
  motion_attn_pool: true       # set false for experiment A or B

training:
  epochs: 60
  batch_size: 128
  learning_rate: 0.00003   # 3e-5 — same as v1
  weight_decay: 0.0005
  grad_clip_norm: 1.0
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0001
  label_smoothing: 0.05
  seed: 42
  num_workers: 2
  class_weighting: false
  max_samples_per_class: 3000

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 8
  min_lr: 0.000001

export:
  onnx: false
  torchscript: false
