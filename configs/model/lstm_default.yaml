model:
  model_name: lstm_v1
  input_size: 147
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  num_classes: 8

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0001
  seed: 42
  num_workers: 0
  class_weighting: true

splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 3
  min_lr: 0.000001

export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  registry_path: models/registry.json
  feature_schema_version: feature-schema-v5

# Augmentation is disabled by default for the initial dataset.
# Enable when you have ≥10 recordings per class and want regularisation.
augmentation:
  enabled: true
  # Speed factor drawn uniformly per sample.
  # < 1 → slower gesture,  > 1 → faster gesture.
  temporal_scale_range: [0.8, 1.2]
  # Gaussian σ on normalised landmark positions (unit = hand size ≈ 1).
  spatial_jitter_sigma: 0.005
  # Probability each augmentation fires independently on a given sample.
  apply_prob: 0.5
  # Mirror flip is intentionally disabled here.
  # Applying it without label remapping injects label noise into swipe_left/right.
  # Use the label-aware mirror augmentation in 01_dataset_preparation.ipynb instead.
  mirror_flip_prob: 0.0
