# ── Two-Stream LSTM — IPN 32-frame comparison configuration ──────────────────
#
# This config mirrors two_stream_lstm.yaml but is tuned for the IPN dataset
# comparison experiment using a 32-frame sliding window (matching the input
# length used by ResNeXt-101, C3D, and ResNet-50 in the IPN Hand paper).
#
# Dataset:  build with --window-length 32 --window-step 1
#           python scripts/build_ipn_dataset.py \
#               --window-length 32 --window-step 1 \
#               --output-npz data/processed/ipn_dataset_v5_w32.npz
#
# Hyperparameters follow the Phase-B alignment with the IEEE paper:
#   - LR 1e-4  (paper: 0.001 but Adam with 1e-4 matches published practices)
#   - No label smoothing  (paper: plain CrossEntropyLoss)
#   - Early stopping on val_macro_f1 (maximize)  ← NOT val_loss
#   - Mirror augmentation enabled (mirror_flip_prob = 0.5)
#   - Class weighting disabled
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_name: two_stream_lstm_v1
  input_size: 147       # total feature dims (feature-schema-v5); split internally
  hidden_size: 64       # per-stream hidden size; fused layer receives 2×64 = 128
  num_layers: 2
  dropout: 0.3
  num_classes: 12       # all 11 IPN gesture classes + unknown

# ── Design notes ─────────────────────────────────────────────────────────────
# Stream A (Pose, 73 dims):
#   positions[0:63]    — 21 wrist-relative landmarks × 3
#   joint_angles[134:144] — 10 MCP + PIP angles
#
# Stream B (Motion, 74 dims):
#   fingertip_spread[63:68]  — 5 inter-fingertip distances
#   wrist_trajectory[68:71]  — 3 net wrist displacement
#   velocity[71:134]         — 21 per-landmark velocity vectors × 3
#   wrist_vel_raw[144:147]   — 3 camera-normalised wrist velocity
#
# Window length: 32 frames (≈1067 ms at 30 FPS) — aligned with IPN paper.
# Window step  : 1 frame  — fine-grained coverage of isolated gesture segments.
# ─────────────────────────────────────────────────────────────────────────────

training:
  epochs: 80
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0001
  seed: 42
  num_workers: 0
  class_weighting: false

splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 5
  min_lr: 0.000001

export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  feature_schema_version: feature-schema-v5

augmentation:
  enabled: true
  temporal_scale_range: [0.8, 1.2]
  spatial_jitter_sigma: 0.005
  apply_prob: 0.5
  # Mirror flip applies label-aware horizontal inversion (left ↔ right swipe).
  # Enabled here — build the mirrored variant with build_ipn_dataset.py and
  # use ipn_dataset_v5_w32_mirrored.npz for best results.
  mirror_flip_prob: 0.5
