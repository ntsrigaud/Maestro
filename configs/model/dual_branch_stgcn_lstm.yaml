model:
  model_name: dual_stgcn_lstm_v1
  # Unused by graph-based models (kept for ModelConfig compatibility)
  input_size: 201
  hidden_size: 256
  num_layers: 2
  # ── Graph topology ────────────────────────────────────────────────────────
  num_nodes: 67 # graph-schema-v1 node count
  num_coords: 3 # (x, y, z) per node
  # ── STGCN backbone (Branch 2) ─────────────────────────────────────────────
  stgcn_channels: [64, 128, 256] # 3 STGCNBlocks; fully-connected K=3 adj
  num_stgcn_layers: 3
  # ── Phonological SA-ConvLSTM branch (Branch 1) ───────────────────────────
  # Branch 1 computes structured geometric phonological features λ(k) per frame:
  #   H(k): 15 finger joint angles + 4 inter-finger angles (both hands = 38)
  #   n(k): palm unit normal (cross product wrist→index-MCP × wrist→pinky-MCP, both hands = 6)
  #   l(k): middle-finger MCP position (both hands = 6)
  #   μ(k): velocity, acceleration, curvature of middle-MCP trajectory (both hands = 6)
  #   phono_feat_dim = 56 (28 per hand × 2 hands, no learnable extraction)
  phono_conv_channels: 256 # temporal Conv1d output channels (input=56)
  lstm_hidden: 256 # LSTM hidden size (also used as phono_lstm_hidden)
  lstm_layers: 2 # LSTM layers    (also used as phono_lstm_layers)
  # ── Regularisation & output ───────────────────────────────────────────────
  dropout: 0.3
  num_classes: 8

# ── Architecture summary ──────────────────────────────────────────────────────
#
# Input: (B, T=24, N=67, C=3) — graph-schema-v1 normalised skeleton sequence
#
# Branch 1 — Phonological SA-ConvLSTM
#   feature_extractor: _PhonologicalFeatureExtractor (no params)
#     → λ(k) = [joint_angles(19×2), palm_normal(3×2), position(3×2), motion(3×2)]
#     → (B, T, 56) — deterministic geometric features
#   temporal_conv: Conv1d(56 → 256, k=3) + BN + ReLU → (B, T, 256)
#   lstm         : LSTM(256 → 256, layers=2) → (B, T, 256)
#   self_attn    : Q/K/V self-attention (Eq.6-8) + residual (w_f·Z + H) → (B, T, 256)
#   attn         : Bahdanau temporal attention → (B, 256)
#
# Branch 2 — STGCN (3 blocks, fully-connected K=3 partitioned adjacency)
#   Block 1: STGCNBlock(3   → 64,  K=3, residual=True)  [1×1 projection]
#   Block 2: STGCNBlock(64  → 128, K=3, residual=True)  [1×1 projection]
#   Block 3: STGCNBlock(128 → 256, K=3, residual=True)  [1×1 projection]
#   Pool    : mean over N and T → (B, 256)
#
# Fusion
#   cat(Branch1, Branch2) → (B, 512)
#   Dropout(0.3) → Linear(512 → 8) → (B, 8)
#
# Adjacency: fully-connected K=3 partitioned (dense 67×67 graph).
#   Partition 0 (self)       : I_67
#   Partition 1 (centripetal): dense edges i→j where BFS dist[j] < dist[i]
#   Partition 2 (centrifugal): dense edges i→j where BFS dist[j] ≥ dist[i]
#   Row-normalised: D_k^{-1} A_k
#
# Graph schema version: graph-schema-v1
# Checkpoint artifact type: dual_stgcn_lstm_inference
# ─────────────────────────────────────────────────────────────────────────────

training:
  epochs: 80 # more epochs needed at lr=1e-4
  batch_size: 32
  learning_rate: 0.0001 # paper: "learning rates for STGCN and SA-ConvLSTM set to 1e-4"
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 20 # adjusted for slower convergence at lr=1e-4
  early_stopping_min_delta: 0.0001
  seed: 42
  num_workers: 0
  class_weighting: true

splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 10 # allow more epochs at each lr level before reducing
  min_lr: 0.000001

export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  feature_schema_version: ""
  graph_schema_version: graph-schema-v1

augmentation:
  enabled: true
  temporal_scale_range: [0.85, 1.15]
  spatial_jitter_sigma: 0.005
  apply_prob: 0.5
  mirror_flip_prob: 0.0
