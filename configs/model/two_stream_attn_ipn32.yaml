# ── EnhancedTwoStreamLSTM — IPN 32-frame comparison configuration ─────────────
#
# This config trains the improved two_stream_attn architecture:
#   - Bidirectional LSTMs (forward + backward context)
#   - Sinusoidal positional encoding on BiLSTM output (new)
#   - Output dropout on position-encoded LSTM output (new regularisation)
#   - Multi-Head Self-Attention (Q/K/V, 8 heads) on each stream
#   - Cross-stream cross-attention replacing the scalar sigmoid gate (new)
#   - Feature projection layers (73/74 → proj_dim before LSTM)
#   - Deeper GELU MLP head with LayerNorm
#   - AdamW optimiser with label_smoothing=0.1
#
# Dataset: build with --window-length 32 --window-step 1
#   python scripts/build_ipn_dataset.py \
#       --window-length 32 --window-step 1 \
#       --output-npz data/processed/ipn_dataset_v5_w32.npz
#
# ── Root-cause analysis of v1 runs (train 010955Z / 013330Z) ─────────────────
#
#   Run 1 (lr=3e-4):  best_epoch=3,  val_F1=73.5%, test_F1=67.3%  ← too fast
#   Run 2 (lr=9e-5):  best_epoch=9,  val_F1=73.5%, test_F1=70.3%  ← still early
#
#   Five root causes identified and addressed:
#
#   1. No positional encoding: MHA was permutation-invariant over T frames —
#      temporal order ignored.  Fix: sinusoidal PE added to LSTM output.
#
#   2. Weak cross-stream fusion: sigmoid(Linear(ctx)) is a single-vector gate.
#      Fix: full cross-attention lets each stream focus on specific *frames*
#      of the other stream most diagnostic for the gesture.
#
#   3. Overfitting: train acc 88% vs val 75% at best epoch (13% gap), growing
#      to >18% by epoch 11.  Fix: dropout 0.3→0.45, weight_decay 0.0009→0.001.
#
#   4. Under-capacity for 12-class IPN: 541K params at hidden_size=64.
#      Fix: hidden_size 64→128 (BiLSTM output 256), proj_dim 64→128.
#      New total with cross-attention: ≈2.52M params.
#
#   5. Class imbalance ignored: open_palm_hold 8093 vs click_one 4558 (1.77×).
#      Fix: class_weighting=true enables inverse-frequency loss weighting.
#
# ── IPN research baseline targets (GTX 1080ti) ───────────────────────────────
#   ResNeXt-101  RGB-Flow  86.32%   50.8 ms
#   ResNeXt-101  RGB       83.59%   27.7 ms
#   C3D          RGB       77.75%   76.2 ms   ← v1 parity
#   Target       Skeleton  ≥ 85%    < 5 ms    ← this config
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_name: two_stream_attn_v1
  input_size: 147 # total feature dims (feature-schema-v5)
  hidden_size: 128 # per-direction per-stream; BiLSTM output = 2×128 = 256
  num_layers: 2
  dropout: 0.45 # was 0.3 — stronger regularisation to reduce 18% overfit gap
  num_classes: 12 # all 11 IPN Hand gesture classes (G01–G11) + unknown
  # EnhancedTwoStreamLSTM-specific fields
  num_heads: 8 # MHA heads; must divide 2×hidden_size=256 (8 divides evenly)
  proj_dim: 128 # feature projection dim (73/74 → 128 before LSTM)

# ── Design notes ─────────────────────────────────────────────────────────────
# Approximate parameter budget (hidden_size=128, proj_dim=128, num_heads=8):
#   proj_a / proj_b             2 × ~10 K              ≈   20 K
#   BiLSTM-A  (2L bidir 128)    layer1 264K+layer2 394K ≈  658 K
#   BiLSTM-B                    (identical)             ≈  658 K
#   Self-MHA-A / Self-MHA-B     2 × (8 × 256² + …)     ≈  526 K
#   Cross-attn A→B / B→A        2 × (same dims)        ≈  526 K
#   LayerNorm × 8               negligible              ≈    2 K
#   Head MLP                    512 → 256 → 12          ≈  134 K
#   Total                                               ≈ 2.52 M
# ─────────────────────────────────────────────────────────────────────────────

training:
  epochs: 100
  batch_size: 128 # larger batch → more stable gradient estimates
  learning_rate: 0.00009 # lr=9e-5 outperformed 3e-4 in ablation (best epoch 9 vs 3)
  weight_decay: 0.001 # was 0.0009 — higher decay to combat overfitting
  grad_clip_norm: 1.0
  early_stopping_patience: 25 # was 20 — extra patience for larger model to warm up
  early_stopping_min_delta: 0.0001
  label_smoothing: 0.1
  seed: 42
  num_workers: 0
  class_weighting: true # was false — corrects open_palm_hold(8093) vs click_one(4558)

splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 10 # was 7 — give larger model more time before LR reduction
  min_lr: 0.000001

export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  feature_schema_version: feature-schema-v5

augmentation:
  enabled: true
  temporal_scale_range: [0.75, 1.25]
  spatial_jitter_sigma: 0.008
  apply_prob: 0.6
  mirror_flip_prob: 0.5
