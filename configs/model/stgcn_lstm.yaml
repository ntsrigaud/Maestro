model:
  model_name: stgcn_lstm_v1
  # Graph topology
  num_nodes: 67 # graph-schema-v1 node count
  num_coords: 3 # (x, y, z) per node
  # STGCN backbone
  stgcn_channels: [64, 128] # output channels for the two STGCN blocks
  num_stgcn_layers: 2
  # Recurrent head
  lstm_hidden: 128
  lstm_layers: 2
  # Regularisation
  dropout: 0.3
  # Output
  num_classes: 8

# ── Architecture summary ──────────────────────────────────────────────────────
#
# Input   : (B, T=24, N=67, C=3) — graph-schema-v1 normalised keypoints
#
# Block 1 : STGCNBlock(3  → 64,  temporal_kernel=3)
#            ├─ 1-hop graph conv (normalised adjacency, registered buffer)
#            ├─ multi-scale temporal conv (kernel 3 + kernel 5, concat→64)
#            └─ BatchNorm + ReLU  [no residual: 3 ≠ 64]
#
# Block 2 : STGCNBlock(64 → 128, temporal_kernel=3)
#            ├─ 1-hop graph conv
#            ├─ multi-scale temporal conv (kernel 3 + kernel 5, concat→128)
#            ├─ skip projection: Conv1d(64→128, k=1) + BN
#            └─ BatchNorm + ReLU + residual
#
# Pool    : mean over node dim → (B, T, 128)
#
# LSTM    : 2 layers, hidden=128, batch_first=True → (B, T, 128)
#
# Attn    : additive Bahdanau attention → context (B, 128)
#
# Head    : Dropout(0.3) → Linear(128, 8)
#
# Parameter budget ≈ 357 K  (budget: ≤500 K)
#
# Checkpoint artifact type : stgcn_lstm_inference
# HuggingFace model id     : ntsrigaud/maestro-stgcn
# Graph schema version      : graph-schema-v1
# ─────────────────────────────────────────────────────────────────────────────

training:
  epochs: 40
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  # Graph data — dataset loader selects this when NPZ contains adjacency key.
  graph_schema_version: graph-schema-v1
