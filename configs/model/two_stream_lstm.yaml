model:
  model_name: two_stream_lstm_v1
  input_size: 147 # total feature dims (feature-schema-v5); split internally
  hidden_size: 64 # per-stream hidden size; fused layer receives 2×64 = 128
  num_layers: 2
  dropout: 0.3
  num_classes: 8

# ── Design notes ─────────────────────────────────────────────────────────────
# Stream A (Pose, 73 dims):
#   positions[0:63]    — 21 wrist-relative landmarks × 3
#   joint_angles[134:144] — 10 MCP + PIP angles
#
# Stream B (Motion, 74 dims):
#   fingertip_spread[63:68]  — 5 inter-fingertip distances
#   wrist_trajectory[68:71]  — 3 net wrist displacement
#   velocity[71:134]         — 21 per-landmark velocity vectors × 3
#   wrist_vel_raw[144:147]   — 3 camera-normalised wrist velocity
#
# Parameter budget ≈ 182 K (vs ~264 K for lstm_v1 at hidden=128).
# Primary hypothesis: dedicated motion pathway improves swipe recall by
# removing gradient competition with the larger pose block (Tier 4-A,
# model-improvement-plan.md).
# ─────────────────────────────────────────────────────────────────────────────

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0001
  seed: 42
  num_workers: 0
  class_weighting: true

splits:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true

scheduler:
  enabled: true
  factor: 0.5
  patience: 3
  min_lr: 0.000001

export:
  checkpoint_dir: models/checkpoints
  exported_dir: models/exported
  feature_schema_version: feature-schema-v5

augmentation:
  enabled: true
  temporal_scale_range: [0.8, 1.2]
  spatial_jitter_sigma: 0.005
  apply_prob: 0.5
  # Mirror flip applies label-aware horizontal inversion (left ↔ right swipe).
  # Disabled here — use the label-aware mirror augmentation in
  # 01_dataset_preparation.ipynb with ipn_dataset_v5_mirrored.npz instead.
  mirror_flip_prob: 0.0
