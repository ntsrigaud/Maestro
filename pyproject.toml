[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "1.0.0"
description = "Maestro — real-time hand gesture recognition for presentation control"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Neil Taïson Rigaud" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
  "numpy>=1.26.0,<2.0.0",
  "torch>=2.7.0",
  # opencv is intentionally NOT listed here.
  #   pip install -e '.[ui]'       → opencv-python       (full, for GUI)
  "mediapipe==0.10.14",
  "pyautogui>=0.9.54; sys_platform != 'darwin'",
  "huggingface_hub>=0.22.0",
]

[project.optional-dependencies]
training = [
  "scikit-learn>=1.5.0",
]
notebooks = [
  "scikit-learn>=1.5.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "pandas>=2.2.0",
  "jupyter>=1.0.0",
  "ipykernel>=6.29.0",
]
ui = [
  "PySide6>=6.7.0",
  "opencv-python>=4.10.0",
]
dev = [
  "pytest>=8.0.0",
  # PySide6 and pytest-qt live in [ui] — conftest.py already skips test_ui_* files
  # when PySide6 is absent, so CI installs [dev] without pulling in 255 MB of Qt.
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "types-PyYAML>=6.0.12",
  "types-PyAutoGUI",
]
build = [
  "pyinstaller>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maestro._defaults" = ["configs/**/*.yaml", "configs/**/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "training: marks tests that require the training optional dependencies (scikit-learn)",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

# The packages below are heavy runtime deps not installed in the lightweight lint
# job.  ignore_missing_imports is a no-op when the package IS installed, so
# these overrides are safe for local development too.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["AppKit", "AppKit.*"]
ignore_missing_imports = true
