[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.1.0"
description = "Maestro — real-time hand gesture recognition for presentation control"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
  "numpy>=1.26.0",
  "torch>=2.7.0",
  # opencv is intentionally NOT listed here.
  # opencv-python and opencv-python-headless both provide the cv2 namespace and
  # conflict with each other.  Install exactly one via an extra:
  #   pip install -e '.[ui]'       → opencv-python       (full, for GUI)
  #   pip install -e '.[headless]' → opencv-python-headless (for CI / scripts)
  "mediapipe==0.10.14",
  "pyautogui>=0.9.54",
  "huggingface_hub>=0.22.0",
]

[project.optional-dependencies]
headless = [
  # Headless OpenCV for server-side scripts, training, and CI.
  # Do NOT install alongside the ui extra — they conflict (both provide cv2).
  "opencv-python-headless>=4.10.0",
]
training = [
  "scikit-learn>=1.5.0",
]
notebooks = [
  "scikit-learn>=1.5.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "pandas>=2.2.0",
  "jupyter>=1.0.0",
  "ipykernel>=6.29.0",
]
ui = [
  "PySide6>=6.7.0",
  # pytest-qt is here (not in dev) so UI tests can be toggled independently of CI.
  "pytest-qt>=4.4.0",
  # Full OpenCV with display backend required for the preview window.
  # Mutually exclusive with the headless extra.
  "opencv-python>=4.10.0",
]
dev = [
  "pytest>=8.0.0",
  # PySide6 and pytest-qt live in [ui] — conftest.py already skips test_ui_* files
  # when PySide6 is absent, so CI installs [dev] without pulling in 255 MB of Qt.
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "types-PyYAML>=6.0.12",
  "types-PyAutoGUI",
]
build = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
maestro = "maestro.app.main:main"

[project.gui-scripts]
maestro-ui = "maestro.app.ui.app_ui:run_ui"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maestro._defaults" = ["configs/**/*.yaml", "configs/**/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "training: marks tests that require the training optional dependencies (scikit-learn)",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["AppKit", "AppKit.*"]
ignore_missing_imports = true
