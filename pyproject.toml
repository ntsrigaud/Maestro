[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-recognition-system"
version = "0.1.0"
description = "Hand Gesture Recognition System for Computer Control"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "CSU Capstone Team"}
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
]

[tool.setuptools]
packages = ["input_manager", "shared"]

[tool.setuptools.package-dir]
input_manager = "src/input-manager"
shared = "src/shared"

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]
