[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "presentation-meeting-control"
version = "0.1.0"
description = "MediaPipe + LSTM gesture control system scaffolding"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
  "numpy>=1.26.0",
  "torch>=2.7.0",
  "opencv-python-headless>=4.10.0",
  "mediapipe==0.10.14",
  "pyautogui>=0.9.54",
  "huggingface_hub>=0.22.0",
]

[project.optional-dependencies]
training = [
  "scikit-learn>=1.5.0",
]
notebooks = [
  "scikit-learn>=1.5.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "pandas>=2.2.0",
  "jupyter>=1.0.0",
  "ipykernel>=6.29.0",
]
huggingface = [
  # huggingface_hub is now a core runtime dependency.
  # This extra is retained for backwards compatibility with existing install
  # commands that reference it (e.g. pip install -e ".[huggingface]").
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "types-PyYAML>=6.0.12",
  "types-PyAutoGUI",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "training: marks tests that require the training optional dependencies (scikit-learn)",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true
