[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-hgr"
version = "0.1.0"
description = "Semantic Hand Gesture Recognition System with Vision-Language Models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "CSU Capstone Team"}
]
license = {text = "MIT"}
keywords = ["gesture-recognition", "computer-vision", "clip", "semantic-understanding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Production dependencies - ALL required for full system functionality
# Includes perception, representation, and semantic layers
dependencies = [
    # Layer 1: Perception - Camera capture and hand detection
    "numpy>=1.24.0,<2.0.0",              # Array operations for frame data  
    "pillow>=9.0.0,<13.0.0",             # Image format support
    "opencv-python>=4.8.0",              # Camera capture and image processing
    "mediapipe==0.10.21",                # Hand detection (last version with solutions API)
    
    # Layer 2-3: Representation and Semantic Intent - CLIP integration
    "torch>=2.0.0",                      # Deep learning framework
    "torchvision>=0.15.0",               # Vision preprocessing
    "open-clip-torch>=2.20.0",           # OpenCLIP implementation for semantic embeddings
    
    # Analysis and visualization (required by console scripts)
    "matplotlib>=3.5.0",                 # Plotting for calibration and analysis scripts
    "seaborn>=0.11.0",                   # Statistical visualization
    "scikit-learn>=1.0.0",               # Metrics for analysis scripts
    
    # Utilities
    "tqdm>=4.65.0",                      # Progress bars for scripts
]

[project.optional-dependencies]
# Development tools and testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

# Phase 4-6: Semantic command matching (future layer)
semantic-matching = [
    "sentence-transformers>=2.2.0",  # Command similarity matching
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]

# Console scripts for command-line tools
[project.scripts]
prepare-calibration-dataset = "semantic_hgr.scripts.prepare_calibration_dataset:main"
calibration-study = "semantic_hgr.scripts.calibration_study:main"
intent-overlap-analysis = "semantic_hgr.scripts.intent_overlap_analysis:main"
realtime-demo = "semantic_hgr.scripts.realtime_demo:main"
validate-clip-integration = "semantic_hgr.scripts.validate_clip_integration:main"
validate-hand-detection = "semantic_hgr.scripts.validate_hand_detection:main"
validate-input-layer = "semantic_hgr.scripts.validate_input_layer:main"

