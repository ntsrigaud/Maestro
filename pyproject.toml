[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-hgr"
version = "0.2.0"
description = "Dual-Stream Supervised Hand Gesture Recognition — Architecture A (GCN + ViT-B/16)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Neil Chang — Colorado State University"}
]
license = {text = "MIT"}
keywords = ["gesture-recognition", "computer-vision", "graph-neural-network",
            "dual-stream", "geometric-inductive-bias", "mediapipe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Architecture A dependencies
# Dual-stream supervised model: GCN (geometric) + ViT-B/16 (RGB) + cross-attention fusion
dependencies = [
    # Perception layer — hand detection and keypoint extraction
    "numpy>=1.24.0,<2.0.0",              # Array operations
    "pillow>=9.0.0,<13.0.0",             # Image format support
    "opencv-python>=4.8.0",              # Camera capture and image processing
    "mediapipe==0.10.21",                # Hand detection + 21-keypoint extraction (pin: solutions API)

    # Deep learning core
    "torch>=2.0.0",                      # PyTorch
    "torchvision>=0.15.0",               # Vision transforms and datasets
    "timm>=0.9.0",                       # ViT-B/16 (vit_base_patch16_224, ImageNet init)
    "torch-geometric>=2.3.0",            # GCNConv for 21-keypoint skeleton graph

    # Evaluation and visualization
    "matplotlib>=3.5.0",                 # Reliability diagrams, confusion matrix plots
    "seaborn>=0.11.0",                   # Heatmaps
    "scikit-learn>=1.0.0",               # ECE, accuracy, F1, McNemar's test
    "pandas>=1.5.0",                     # Result tables

    # Utilities
    "tqdm>=4.65.0",                      # Progress bars
]

[project.optional-dependencies]
# Development tools and testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

# Dataset download (scripts/download_hagrid_subset.py)
download = [
    "datasets>=2.0.0",  # HuggingFace streaming download for HaGRID
]

# Architecture B (future): contrastive alignment to CLIP text encoder
semantic-matching = [
    "sentence-transformers>=2.2.0",  # Command similarity matching (Architecture B Stage 2)
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]

# Console scripts for Architecture A pipeline
[project.scripts]
validate-hand-detection = "semantic_hgr.scripts.validate_hand_detection:main"
validate-input-layer = "semantic_hgr.scripts.validate_input_layer:main"

