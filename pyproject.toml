[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-gesture-system"
version = "0.1.0"
description = "Semantic Gesture Understanding System for Computer Control"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "CSU Capstone Team"}
]
# Core runtime dependencies for pip install -e .
# Phase 1 minimal: Input layer (Layer 1: Perception) only
# CLIP and semantic dependencies will be added in Phase 1 Week 1-2
#
# NOTE: opencv-python (pip) vs opencv (conda) conflict:
# When using conda environment, opencv is installed via conda in environment.yml.
# Running `pip install -e .` will attempt to install opencv-python wheel alongside,
# which can cause ABI/runtime conflicts. Recommended workflows:
# 1. Conda: Use `pip install -e . --no-deps` to skip opencv-python installation
# 2. Pure pip: Use `pip install -e .` which installs opencv-python wheel
dependencies = [
    "opencv-python>=4.8.0,<5.0.0",       # Camera capture and image operations
    "numpy>=1.24.0,<2.0.0",              # Array operations for frame data  
    "pillow>=9.0.0,<13.0.0",             # Image format support
    "mediapipe==0.10.21",                # Hand detection (last version with solutions API)
]

[project.optional-dependencies]
# Development tools
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "tqdm>=4.65.0",              # Progress bars for scripts
]

# Phase 1 Week 1-2: CLIP integration dependencies
clip = [
    "torch>=2.0.0",              # CLIP backbone
    "torchvision>=0.15.0",       # Vision preprocessing
    "open-clip-torch>=2.20.0",   # OpenCLIP implementation
]

# Phase 1 Week 2-3: Semantic command matching
semantic = [
    "sentence-transformers>=2.2.0",  # Command similarity matching
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]
