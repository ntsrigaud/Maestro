name: gesture
channels:
  - conda-forge
  - defaults
dependencies:
  # ====================
  # Core Python Runtime
  # ====================
  - python=3.10

  # ====================
  # Computer Vision & Input Layer (Phase 1 Layer 1: Perception)
  # ====================
  # OpenCV - camera capture and image processing
  - conda-forge::opencv>=4.8.0

  # NumPy - array operations for frame data
  - conda-forge::numpy>=1.24.0

  # Pillow - image format support
  - conda-forge::pillow>=9.0.0

  # ====================
  # Development & Testing
  # ====================
  # Progress bars for scripts
  - conda-forge::tqdm>=4.65.0

  # ====================
  # Package Manager
  # ====================
  - pip

  # ====================
  # Pip-Only Dependencies
  # ====================
  # MediaPipe - hand detection (pin to 0.10.21 - last version with solutions API)
  # Versions 0.10.22+ removed mp.solutions.hands and require migration to tasks.vision API
  - pip:
      - mediapipe==0.10.21
